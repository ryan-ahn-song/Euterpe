name: example-mild-music
description: Demonstration-only mild sloping audiogram; replace with measured values and verify professionally.

audio:
  sample_rate: 48000
  block_size: 256
  input_channels: 1
  output_channels: 2

audiogram:
  frequencies_hz: [250, 500, 1000, 2000, 3000, 4000, 6000, 8000]
  hearing_loss_db_hl: [20, 25, 30, 35, 40, 40, 35, 30]
  manual_gain_db: null

compression:
  knee_dbfs: -45
  ratio: 2.0
  attack_ms: 8
  release_ms: 120
  low_level_gate_dbfs: -78
  max_gain_db: 12

music:
  enabled: true
  harmonic_boost_db: 1.5
  pitch_min_hz: 80
  pitch_max_hz: 1000
  confidence_threshold: 0.55

limiter:
  ceiling_dbfs: -9
  release_ms: 80
  startup_ramp_ms: 1000

calibration:
  output_calibrated: false
  calibrated_device: ""
  verified_by: ""
  notes: Example values only. dBFS is not dB SPL.
