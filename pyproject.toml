[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-ci-coder"
version = "0.3.0"
description = "MeloBridge-CAPE music hearing-assist prototype and cochlear-implant research simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
live = ["sounddevice>=0.4.6"]

[project.scripts]
music-ci = "music_ci.cli:main"
hearing-assist = "hearing_assist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
